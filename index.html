<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AI房产助手</title>
  <style>
  :root {
    --bg-primary: #0f1117;
    --bg-secondary: #1a1d27;
    --bg-card: #222633;
    --bg-input: #2a2f3e;
    --border: #3a4055;
    --text-primary: #e8eaed;
    --text-secondary: #9aa0b0;
    --accent: #6366f1;
    --accent-hover: #818cf8;
    --accent-glow: rgba(99, 102, 241, 0.25);
    --user-bubble: #3730a3;
    --ai-bubble: #2a2f3e;
    --radius: 16px;
    --radius-sm: 10px;
  }

  * {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
  }

  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC",
      "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
    background: var(--bg-primary);
    color: var(--text-primary);
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    line-height: 1.6;
  }

  /* 背景装饰 */
  body::before {
    content: "";
    position: fixed;
    inset: 0;
    background:
      radial-gradient(ellipse 80% 50% at 50% -20%, rgba(99, 102, 241, 0.15), transparent),
      radial-gradient(ellipse 60% 40% at 100% 100%, rgba(139, 92, 246, 0.08), transparent);
    pointer-events: none;
    z-index: 0;
  }

  header {
    position: relative;
    z-index: 1;
    padding: 24px 24px 16px;
    text-align: center;
    border-bottom: 1px solid var(--border);
    background: rgba(15, 17, 23, 0.8);
    backdrop-filter: blur(12px);
  }

  #clearBtn {
    position: absolute;
    right: 16px;
    top: 50%;
    transform: translateY(-50%);
    padding: 8px 14px;
    background: transparent;
    border: 1px solid var(--border);
    border-radius: var(--radius-sm);
    color: var(--text-secondary);
    font-size: 0.8125rem;
    cursor: pointer;
    transition: color 0.2s, border-color 0.2s, background 0.2s;
  }

  #clearBtn:hover {
    color: var(--text-primary);
    border-color: var(--accent);
    background: rgba(99, 102, 241, 0.1);
  }

  #clearBtn:disabled {
    opacity: 0.4;
    cursor: not-allowed;
  }

  header h1 {
    font-size: 1.5rem;
    font-weight: 700;
    letter-spacing: 0.02em;
    background: linear-gradient(135deg, #e8eaed 0%, #a5b4fc 100%);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    background-clip: text;
  }

  header p {
    margin-top: 6px;
    font-size: 0.875rem;
    color: var(--text-secondary);
  }

  .chat-container {
    position: relative;
    z-index: 1;
    flex: 1;
    display: flex;
    flex-direction: column;
    max-width: 800px;
    width: 100%;
    margin: 0 auto;
    padding: 0 16px;
    overflow: hidden;
    min-height: 0;
  }

  .chat-history {
    flex: 1;
    overflow-y: auto;
    padding: 24px 0;
    display: flex;
    flex-direction: column;
    gap: 16px;
    scroll-behavior: smooth;
    min-height: 0;
  }

  .chat-history::-webkit-scrollbar {
    width: 6px;
  }

  .chat-history::-webkit-scrollbar-track {
    background: transparent;
  }

  .chat-history::-webkit-scrollbar-thumb {
    background: var(--border);
    border-radius: 3px;
  }

  .welcome {
    flex: 1;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    text-align: center;
    padding: 48px 24px;
    color: var(--text-secondary);
    width: 100%;
  }

  .welcome-icon {
    width: 64px;
    height: 64px;
    margin: 0 auto 16px;
    background: linear-gradient(135deg, var(--accent), #8b5cf6);
    border-radius: 20px;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 28px;
    box-shadow: 0 8px 32px var(--accent-glow);
  }

  .welcome h2 {
    font-size: 1.125rem;
    color: var(--text-primary);
    margin-bottom: 8px;
    font-weight: 600;
    width: 100%;
  }

  .welcome p {
    font-size: 0.875rem;
    max-width: 360px;
    width: 100%;
    margin: 0;
  }

  .message {
    display: flex;
    gap: 12px;
    animation: fadeIn 0.3s ease;
  }

  @keyframes fadeIn {
    from {
      opacity: 0;
      transform: translateY(8px);
    }
    to {
      opacity: 1;
      transform: translateY(0);
    }
  }

  .message.user {
    flex-direction: row-reverse;
  }

  .avatar {
    width: 36px;
    height: 36px;
    border-radius: 10px;
    flex-shrink: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 16px;
    font-weight: 600;
  }

  .message.user .avatar {
    background: linear-gradient(135deg, var(--accent), #8b5cf6);
    color: white;
  }

  .message.ai .avatar {
    background: var(--bg-card);
    border: 1px solid var(--border);
  }

  .bubble {
    max-width: 75%;
    padding: 12px 16px;
    border-radius: var(--radius);
    font-size: 0.9375rem;
    word-break: break-word;
  }

  .message.user .bubble {
    background: var(--user-bubble);
    color: #e0e7ff;
    border-bottom-right-radius: 4px;
  }

  .message.ai .bubble {
    background: var(--ai-bubble);
    border: 1px solid var(--border);
    color: var(--text-primary);
    border-bottom-left-radius: 4px;
  }

  .message.ai .bubble.error {
    border-color: #ef4444;
    color: #fca5a5;
  }

  .bubble.typing::after {
    content: "|";
    margin-left: 2px;
    animation: blink 0.8s step-end infinite;
  }

  @keyframes blink {
    50% { opacity: 0; }
  }

  .input-area {
    position: relative;
    z-index: 1;
    padding: 16px 0 24px;
    border-top: 1px solid var(--border);
    background: rgba(15, 17, 23, 0.6);
    backdrop-filter: blur(12px);
    overflow: visible;
  }

  .input-wrapper {
    max-width: 800px;
    width: 100%;
    margin: 0 auto;
    padding: 0 16px;
    display: flex;
    gap: 12px;
    align-items: flex-end;
    min-width: 0;
    box-sizing: border-box;
  }

  #questionInput {
    flex: 1;
    min-width: 0;
    padding: 12px 16px;
    background: var(--bg-input);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    color: var(--text-primary);
    font-size: 0.9375rem;
    font-family: inherit;
    resize: none;
    min-height: 48px;
    max-height: 120px;
    line-height: 1.5;
    transition: border-color 0.2s, box-shadow 0.2s;
    outline: none;
    box-sizing: border-box;
  }

  #questionInput::placeholder {
    color: var(--text-secondary);
  }

  #questionInput:focus {
    border-color: var(--accent);
    box-shadow: 0 0 0 3px var(--accent-glow);
  }

  #questionInput:disabled {
    opacity: 0.6;
    cursor: not-allowed;
  }

  #sendBtn {
    flex: 0 0 auto;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    box-sizing: border-box;
    min-width: 80px;
    height: 48px;
    padding: 0 20px;
    background: linear-gradient(135deg, var(--accent), #7c3aed);
    color: #fff;
    border: none;
    border-radius: var(--radius);
    font-size: 0.9375rem;
    font-weight: 600;
    line-height: 1;
    cursor: pointer;
    transition: transform 0.15s, box-shadow 0.2s, opacity 0.2s;
    white-space: nowrap;
    box-shadow: 0 4px 16px var(--accent-glow);
  }

  #sendBtn:hover {
    transform: translateY(-1px);
    box-shadow: 0 6px 24px var(--accent-glow);
  }

  #sendBtn:active {
    transform: translateY(0);
  }

  #sendBtn:disabled {
    opacity: 0.5;
    cursor: not-allowed;
    transform: none;
  }

  .typing-indicator {
    display: inline-flex;
    gap: 4px;
    padding: 4px 0;
  }

  .typing-indicator span {
    width: 6px;
    height: 6px;
    background: var(--text-secondary);
    border-radius: 50%;
    animation: bounce 1.4s infinite ease-in-out both;
  }

  .typing-indicator span:nth-child(1) { animation-delay: -0.32s; }
  .typing-indicator span:nth-child(2) { animation-delay: -0.16s; }

  @keyframes bounce {
    0%, 80%, 100% { transform: scale(0.6); opacity: 0.4; }
    40% { transform: scale(1); opacity: 1; }
  }

  @media (max-width: 600px) {
    header h1 { font-size: 1.25rem; }
    header { padding-right: 80px; }
    #clearBtn { right: 12px; padding: 6px 10px; font-size: 0.75rem; }
    .bubble { max-width: 85%; }
    #sendBtn { min-width: 72px; padding: 0 16px; }
  }
  </style>
</head>
<body>
  <header>
    <h1>AI房产助手</h1>
    <p>智能解答您的房产疑问</p>
    <button id="clearBtn" type="button">清空对话</button>
  </header>

  <div class="chat-container">
    <div class="chat-history" id="chatHistory">
      <div class="welcome" id="welcome">
        <div class="welcome-icon">🏠</div>
        <h2>欢迎使用 AI 房产助手</h2>
        <p>您可以询问关于买房、卖房、贷款、政策等各类房产问题</p>
      </div>
    </div>
  </div>

  <div class="input-area">
    <div class="input-wrapper">
      <textarea
        id="questionInput"
        placeholder="请输入您的房产问题，按 Enter 发送..."
        rows="1"
      ></textarea>
      <button id="sendBtn" type="button">发送</button>
    </div>
  </div>

  <script>
  const API_KEY = "sk-f2ac4dd7775c4afd81f5ba01a5167518";
  const MODEL = "deepseek-chat";
  const API_URL = "https://api.deepseek.com/v1/chat/completions";
  const SYSTEM_PROMPT =
    "你是一个专业的房产顾问，帮助用户解答关于买房、卖房、贷款、政策等问题，回答要专业、简洁、实用";

  const STORAGE_KEY = "ai-house-chat";

  const chatHistory = document.getElementById("chatHistory");
  const questionInput = document.getElementById("questionInput");
  const sendBtn = document.getElementById("sendBtn");
  const clearBtn = document.getElementById("clearBtn");

  let conversationHistory = [];
  let displayMessages = [];
  let isLoading = false;

  function saveChat() {
    localStorage.setItem(
      STORAGE_KEY,
      JSON.stringify({ conversationHistory, displayMessages })
    );
    clearBtn.disabled = displayMessages.length === 0;
  }

  function loadChat() {
    try {
      const saved = localStorage.getItem(STORAGE_KEY);
      if (!saved) return;

      const data = JSON.parse(saved);
      conversationHistory = data.conversationHistory || [];
      displayMessages = data.displayMessages || [];

      if (displayMessages.length > 0) {
        document.getElementById("welcome")?.remove();
        displayMessages.forEach((msg) => {
          chatHistory.appendChild(
            createMessage(msg.role, msg.content, msg.isError)
          );
        });
        scrollToBottom();
      }
    } catch {
      localStorage.removeItem(STORAGE_KEY);
    }
    clearBtn.disabled = displayMessages.length === 0;
  }

  function clearChat() {
    if (isLoading) return;
    if (displayMessages.length > 0 && !confirm("确定要清空所有对话记录吗？")) {
      return;
    }

    conversationHistory = [];
    displayMessages = [];
    localStorage.removeItem(STORAGE_KEY);

    chatHistory.innerHTML = `
      <div class="welcome" id="welcome">
        <div class="welcome-icon">🏠</div>
        <h2>欢迎使用 AI 房产助手</h2>
        <p>您可以询问关于买房、卖房、贷款、政策等各类房产问题</p>
      </div>`;

    clearBtn.disabled = true;
    questionInput.focus();
  }

  function autoResize(textarea) {
    textarea.style.height = "auto";
    textarea.style.height = Math.min(textarea.scrollHeight, 120) + "px";
  }

  function scrollToBottom() {
    chatHistory.scrollTop = chatHistory.scrollHeight;
  }

  function setInputEnabled(enabled) {
    sendBtn.disabled = !enabled;
    questionInput.disabled = !enabled;
    clearBtn.disabled = !enabled || displayMessages.length === 0;
  }

  function createMessage(role, content, isError = false) {
    const msg = document.createElement("div");
    msg.className = `message ${role}`;

    const avatar = document.createElement("div");
    avatar.className = "avatar";
    avatar.textContent = role === "user" ? "我" : "AI";

    const bubble = document.createElement("div");
    bubble.className = "bubble" + (isError ? " error" : "");
    bubble.textContent = content;

    msg.appendChild(avatar);
    msg.appendChild(bubble);
    return msg;
  }

  function showTypingIndicator() {
    const msg = document.createElement("div");
    msg.className = "message ai";
    msg.id = "typingMsg";

    const avatar = document.createElement("div");
    avatar.className = "avatar";
    avatar.textContent = "AI";

    const bubble = document.createElement("div");
    bubble.className = "bubble";
    bubble.innerHTML =
      '<div class="typing-indicator"><span></span><span></span><span></span></div>';

    msg.appendChild(avatar);
    msg.appendChild(bubble);
    chatHistory.appendChild(msg);
    scrollToBottom();
    return msg;
  }

  async function typeAiMessage(text, isError = false) {
    const msg = createMessage("ai", "", isError);
    chatHistory.appendChild(msg);
    const bubble = msg.querySelector(".bubble");
    bubble.classList.add("typing");

    const totalMs = Math.min(4000, Math.max(800, text.length * 25));
    const chunkSize = Math.max(1, Math.ceil(text.length / (totalMs / 30)));

    for (let i = 0; i < text.length; i += chunkSize) {
      bubble.textContent = text.slice(0, Math.min(i + chunkSize, text.length));
      scrollToBottom();
      await new Promise((r) => setTimeout(r, 30));
    }

    bubble.textContent = text;
    bubble.classList.remove("typing");

    displayMessages.push({ role: "ai", content: text, isError });
    saveChat();
  }

  async function callDeepSeekAPI(userMessage) {
    conversationHistory.push({
      role: "user",
      content: userMessage,
    });

    const response = await fetch(API_URL, {
      method: "POST",
      headers: {
        "Content-Type": "application/json",
        Authorization: `Bearer ${API_KEY}`,
      },
      body: JSON.stringify({
        model: MODEL,
        messages: [
          { role: "system", content: SYSTEM_PROMPT },
          ...conversationHistory,
        ],
      }),
    });

    const data = await response.json();

    if (!response.ok) {
      conversationHistory.pop();
      const errMsg =
        data.error?.message || `请求失败（${response.status}），请稍后重试`;
      throw new Error(errMsg);
    }

    const reply = data.choices?.[0]?.message?.content;
    if (!reply) {
      conversationHistory.pop();
      throw new Error("未收到有效回复，请重试");
    }

    conversationHistory.push({
      role: "assistant",
      content: reply,
    });

    saveChat();
    return reply;
  }

  async function sendMessage() {
    const text = questionInput.value.trim();
    if (!text || isLoading) return;

    document.getElementById("welcome")?.remove();

    chatHistory.appendChild(createMessage("user", text));
    displayMessages.push({ role: "user", content: text });
    saveChat();
    questionInput.value = "";
    autoResize(questionInput);
    scrollToBottom();

    isLoading = true;
    setInputEnabled(false);
    const typingMsg = showTypingIndicator();

    try {
      const reply = await callDeepSeekAPI(text);
      typingMsg.remove();
      await typeAiMessage(reply);
    } catch (err) {
      typingMsg.remove();
      await typeAiMessage(
        err.message || "网络异常，请检查连接后重试",
        true
      );
    } finally {
      isLoading = false;
      setInputEnabled(true);
      scrollToBottom();
      questionInput.focus();
    }
  }

  sendBtn.addEventListener("click", sendMessage);
  clearBtn.addEventListener("click", clearChat);

  questionInput.addEventListener("keydown", (e) => {
    if (e.key === "Enter" && !e.shiftKey) {
      e.preventDefault();
      sendMessage();
    }
  });

  questionInput.addEventListener("input", () => autoResize(questionInput));

  loadChat();
  questionInput.focus();
  </script>
</body>
</html>
